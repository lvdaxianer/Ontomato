spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# PostgreSQL persistence configuration (migration target for business Daos; injected from environment variables, does not affect existing M3 logic when unset)
ontomato.data-engine.jdbc.url=${DATA_ENGINE_JDBC_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/datarag}
ontomato.data-engine.jdbc.username=${POSTGRES_USER:}
ontomato.data-engine.jdbc.password=${POSTGRES_PASSWORD:}
ontomato.data-engine.jdbc.driver-class-name=${DATA_ENGINE_JDBC_DRIVER:org.postgresql.Driver}
